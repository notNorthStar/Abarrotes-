services:
  db:
    image: postgres:16-alpine
    container_name: abarrotes-db
    environment:
      POSTGRES_USER: abarrotes
      POSTGRES_PASSWORD: abarrotes
      POSTGRES_DB: abarrotes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
